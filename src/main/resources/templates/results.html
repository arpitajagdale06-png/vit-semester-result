<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved Results</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body class="bg-light"><div class="container py-5"><div class="card border-0 shadow p-4"><div class="d-flex justify-content-between"><h2>Saved Results</h2><a href="/" class="btn btn-dark">Add Result</a></div><div class="table-responsive mt-3"><table class="table"><thead><tr><th>Name</th><th>Roll No.</th><th>Semester</th><th>Total</th><th>Percentage</th><th>Result</th><th></th></tr></thead><tbody><tr th:each="r:${results}"><td th:text="${r.studentName}"></td><td th:text="${r.rollNo}"></td><td th:text="${r.semester}"></td><td th:text="${r.total}+' / 400'"></td><td th:text="${#numbers.formatDecimal(r.percentage,1,2)}+'%'"></td><td th:text="${r.result}"></td><td><form th:action="@{'/delete/'+${r.id}}" method="post"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></tbody></table></div></div></div></body></html>
