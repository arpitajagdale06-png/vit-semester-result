<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Result</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div class="container py-5"><div class="card border-0 shadow p-4"><div class="d-flex justify-content-between"><div><h2>Semester Result</h2><div th:text="${studentResult.studentName}+' • '+${studentResult.rollNo}"></div></div><a href="/" class="btn btn-outline-dark">New Result</a></div>
<div th:if="${saved}" class="alert alert-success mt-3">Result saved successfully in MySQL.</div><div class="table-responsive mt-3"><table class="table table-bordered text-center"><thead class="table-dark"><tr><th>Subject</th><th>MSE / 30</th><th>ESE / 70</th><th>Final / 100</th></tr></thead><tbody>
<tr><td th:text="${studentResult.subject1}"></td><td th:text="${studentResult.mse1}"></td><td th:text="${studentResult.ese1}"></td><td th:text="${studentResult.final1}"></td></tr><tr><td th:text="${studentResult.subject2}"></td><td th:text="${studentResult.mse2}"></td><td th:text="${studentResult.ese2}"></td><td th:text="${studentResult.final2}"></td></tr><tr><td th:text="${studentResult.subject3}"></td><td th:text="${studentResult.mse3}"></td><td th:text="${studentResult.ese3}"></td><td th:text="${studentResult.final3}"></td></tr><tr><td th:text="${studentResult.subject4}"></td><td th:text="${studentResult.mse4}"></td><td th:text="${studentResult.ese4}"></td><td th:text="${studentResult.final4}"></td></tr></tbody></table></div>
<div class="row g-3"><div class="col-md-4"><div class="bg-light p-3 rounded">Total <b th:text="${studentResult.total}+' / 400'"></b></div></div><div class="col-md-4"><div class="bg-light p-3 rounded">Percentage <b th:text="${#numbers.formatDecimal(studentResult.percentage,1,2)}+'%'"></b></div></div><div class="col-md-4"><div class="bg-light p-3 rounded">Result <b th:text="${studentResult.result}"></b></div></div></div></div></div></body></html>
