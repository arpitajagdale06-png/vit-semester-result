<!doctype html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VIT Semester Result</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f4f7fb}.hero{background:#172a46;color:#fff}.card,.subject{border:0;border-radius:16px;box-shadow:0 7px 24px #0001}.subject{padding:18px;margin-bottom:15px;background:white}.final{background:#eaf7ee!important;font-weight:700}</style>
<script>function calc(){let t=0;for(let i=1;i<=4;i++){let a=+document.getElementById('mse'+i).value||0,b=+document.getElementById('ese'+i).value||0;document.getElementById('final'+i).value=a+b;t+=a+b}document.getElementById('total').textContent=t+' / 400';document.getElementById('pct').textContent=(t/4).toFixed(2)+'%';}</script></head>
<body><div class="hero py-4 mb-4"><div class="container"><h3 class="fw-bold">VIT Semester Result Portal</h3><div>MSE / 30 + ESE / 70 = Final / 100</div></div></div>
<div class="container pb-5"><form class="card p-4" th:action="@{/save}" th:object="${studentResult}" method="post">
<div class="row g-3 mb-4"><div class="col-md-5"><label>Student Name</label><input class="form-control" th:field="*{studentName}" required></div><div class="col-md-3"><label>Roll No.</label><input class="form-control" th:field="*{rollNo}" required></div><div class="col-md-4"><label>Semester</label><input class="form-control" th:field="*{semester}" placeholder="Semester V"></div></div>
<h4>Subject Marks</h4><p class="text-secondary">Final / 100 is calculated automatically as MSE + ESE.</p>
<div th:each="i:${#numbers.sequence(1,4)}" class="subject"><div class="row g-3 align-items-end">
<div class="col-md-4"><label>Subject <span th:text="${i}"></span></label><input class="form-control" th:name="${'subject'+i}" th:field="*{__${'subject'+i}__}" required></div>
<div class="col-md-2"><label>MSE / 30</label><input type="number" min="0" max="30" class="form-control" th:id="${'mse'+i}" th:field="*{__${'mse'+i}__}" oninput="calc()" required></div>
<div class="col-md-2"><label>ESE / 70</label><input type="number" min="0" max="70" class="form-control" th:id="${'ese'+i}" th:field="*{__${'ese'+i}__}" oninput="calc()" required></div>
<div class="col-md-2"><label><b>Final / 100</b></label><input class="form-control final" th:id="${'final'+i}" value="0" readonly></div></div></div>
<div class="row g-3"><div class="col-md-6"><div class="bg-light p-3 rounded">Total<div id="total" class="fs-4 fw-bold">0 / 400</div></div></div><div class="col-md-6"><div class="bg-light p-3 rounded">Percentage<div id="pct" class="fs-4 fw-bold">0.00%</div></div></div></div>
<div class="mt-4"><button class="btn btn-dark px-4">Calculate &amp; Save Result</button> <a href="/results" class="btn btn-outline-secondary">View Saved Results</a></div></form></div></body></html>
